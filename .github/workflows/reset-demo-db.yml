name: Reset demo database

on:
  schedule:
    # Nightly reset ~03:40 UTC. Off the :00/:30 marks to avoid the cron rush.
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reset-demo-db
  cancel-in-progress: false

jobs:
  reset-demo-db:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure the database secret is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DEMO_DATABASE_URL secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter api db:generate

      # Drops the database, re-applies all migrations and runs the seed.
      - name: Reset schema and reseed demo data
        working-directory: apps/api
        run: pnpm exec prisma migrate reset --force
